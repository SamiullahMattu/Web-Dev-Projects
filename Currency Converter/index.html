<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="body">
        <div class="header">
            <h1 class="name">
                Currency Converter
            </h1>
        </div>
        <div class="main">
            <input type="text" class="firstCurrency">
            <div class="currencyContainer">
                <div class="currency1">
                    <img id="img1" src="https://flagsapi.com/BE/flat/64.png">
                    <select name="Currency" id="select1">
                        <option value="Dinar">Dinar</option>
                        <option value="Usd">Usd</option>
                    </select>
                </div>
                <div class="currency2">
                    <img id="img2" src="https://flagsapi.com/NZ/flat/64.png">
                    <select name="Currency" id="select2">
                        <option value="Dinar">Dinar</option>
                        <option value="Usd">Usd</option>
                    </select>
                </div>
            </div>
            <input type="text" class="">
            <div class="btn">
                <button class="convert">Convert</button>
            </div>
        </div>
        <script src="script.js"></script>
    </div>
</body>

</html>
